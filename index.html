<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アニマルカードゲーム カード検索</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }

    /* ========================================
       検索欄
       ======================================== */

    #search-box {
      width: 100%;
      max-width: 600px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    .filter {
      margin-bottom: 15px;
    }

    .filter-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .multi-select {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 800px;
    }

    .multi-select label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }

    .number-filter {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .number-filter select,
    .number-filter input {
      padding: 7px;
      font-size: 16px;
    }

    .number-filter input {
      width: 100px;
    }

    /* ========================================
       ボタン
       ======================================== */

    button {
      cursor: pointer;
    }

    #reset-button,
    #back-button {
      padding: 8px 16px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    /* ========================================
       表示モード切り替え
       ======================================== */

    #display-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .display-control-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .display-button {
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #aaa;
      background: #fff;
      border-radius: 4px;
    }

    .display-button.active {
      background: #333;
      color: #fff;
    }

    /* ========================================
       検索結果
       ======================================== */

    #result-count {
      margin-bottom: 15px;
      font-weight: bold;
    }

    /* ========================================
       リストモード
       ======================================== */

    #card-list.list-mode {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card.list-card {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .card.list-card:hover {
      background: #f5f5f5;
    }

    .list-card-image {
      width: 120px;
      height: auto;
      flex-shrink: 0;
      display: block;
    }

    .list-card-info {
      min-width: 0;
    }

    .list-card-info h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .list-card-info p {
      margin: 4px 0;
    }

    /* ========================================
       アイコンモード
       ======================================== */

    #card-list.icon-mode {
      display: grid;
      gap: 12px;
    }

    /* 小 */
    #card-list.icon-mode.size-small {
      grid-template-columns: repeat(3, 1fr);
    }

    /* 中 */
    #card-list.icon-mode.size-medium {
      grid-template-columns: repeat(5, 1fr);
    }

    /* 大 */
    #card-list.icon-mode.size-large {
      grid-template-columns: repeat(7, 1fr);
    }

    .card.icon-card {
      cursor: pointer;
    }

    .card.icon-card:hover {
      opacity: 0.75;
    }

    .icon-card-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ========================================
       カード詳細画面
       ======================================== */

    #card-detail {
      display: none;
      max-width: 800px;
    }

    #detail-image {
      max-width: 500px;
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 20px;
    }

    .detail-row {
      margin-bottom: 10px;
    }

    .detail-label {
      font-weight: bold;
    }

    #detail-effect {
      white-space: pre-wrap;
    }

    #card-search {
      display: block;
    }

    /* ========================================
       スマートフォン用
       ======================================== */

    @media (max-width: 600px) {

      body {
        margin: 10px;
      }

      .list-card-image {
        width: 90px;
      }

      #card-list.icon-mode.size-small {
        grid-template-columns: repeat(2, 1fr);
      }

      #card-list.icon-mode.size-medium {
        grid-template-columns: repeat(3, 1fr);
      }

      #card-list.icon-mode.size-large {
        grid-template-columns: repeat(4, 1fr);
      }

    }

  </style>
</head>

<body>

  <!-- ========================================
       カード検索画面
       ======================================== -->

  <div id="card-search">

    <h1>アニマルカードゲーム カード検索</h1>


    <!-- 文字検索 -->

    <div class="filter">

      <div class="filter-title">
        文字検索
      </div>

      <input
        type="text"
        id="search-box"
        placeholder="カード名・読み・効果テキストを検索"
      >

    </div>


    <!-- カードタイプ -->

    <div class="filter">

      <div class="filter-title">
        カードタイプ
      </div>

      <div
        id="card-type-filter"
        class="multi-select"
      ></div>

    </div>


    <!-- 種属 -->

    <div class="filter">

      <div class="filter-title">
        種属
      </div>

      <div
        id="species-filter"
        class="multi-select"
      ></div>

    </div>


    <!-- コスト -->

    <div class="filter">

      <div class="filter-title">
        コスト
      </div>

      <div
        id="cost-filter"
        class="multi-select"
      ></div>

    </div>


    <!-- ATK -->

    <div class="filter">

      <div class="filter-title">
        ATK
      </div>

      <div class="number-filter">

        <select id="atk-condition">
          <option value="">指定なし</option>
          <option value="gte">以上</option>
          <option value="lte">以下</option>
        </select>

        <input
          type="number"
          id="atk-value"
          placeholder="数値"
        >

      </div>

    </div>


    <!-- DEF -->

    <div class="filter">

      <div class="filter-title">
        DEF
      </div>

      <div class="number-filter">

        <select id="def-condition">
          <option value="">指定なし</option>
          <option value="gte">以上</option>
          <option value="lte">以下</option>
        </select>

        <input
          type="number"
          id="def-value"
          placeholder="数値"
        >

      </div>

    </div>


    <!-- 公式キーワード -->

    <div class="filter">

      <div class="filter-title">
        公式キーワード
      </div>

      <div
        id="official-keyword-filter"
        class="multi-select"
      ></div>

    </div>


    <!-- 公式効果 -->

    <div class="filter">

      <div class="filter-title">
        公式効果
      </div>

      <div
        id="official-effect-filter"
        class="multi-select"
      ></div>

    </div>


    <!-- リセット -->

    <button id="reset-button">
      検索条件をリセット
    </button>


    <!-- ========================================
         表示設定
         ======================================== -->

    <div id="display-controls">

      <div class="display-control-group">

        <span>表示：</span>

        <button
          id="list-mode-button"
          class="display-button active"
        >
          リスト
        </button>

        <button
          id="icon-mode-button"
          class="display-button"
        >
          アイコン
        </button>

      </div>


      <div
        id="icon-size-controls"
        class="display-control-group"
        style="display: none;"
      >

        <span>サイズ：</span>

        <button
          id="icon-small-button"
          class="display-button"
        >
          小
        </button>

        <button
          id="icon-medium-button"
          class="display-button active"
        >
          中
        </button>

        <button
          id="icon-large-button"
          class="display-button"
        >
          大
        </button>

      </div>

    </div>


    <!-- 検索結果件数 -->

    <div id="result-count">
      読み込み中……
    </div>


    <!-- カード一覧 -->

    <div
      id="card-list"
      class="list-mode"
    >
      読み込み中……
    </div>

  </div>


  <!-- ========================================
       カード詳細画面
       ======================================== -->

  <div id="card-detail">

    <button id="back-button">
      ← 検索結果に戻る
    </button>

    <img
      id="detail-image"
      src=""
      alt=""
    >

    <h1 id="detail-name"></h1>

    <div class="detail-row">
      <span class="detail-label">カードID：</span>
      <span id="detail-id"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">読み：</span>
      <span id="detail-reading"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">コスト：</span>
      <span id="detail-cost"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">カードタイプ：</span>
      <span id="detail-type"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">種属：</span>
      <span id="detail-species"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">ATK：</span>
      <span id="detail-atk"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">DEF：</span>
      <span id="detail-def"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">効果：</span>
      <div id="detail-effect"></div>
    </div>

    <div class="detail-row">
      <span class="detail-label">公式キーワード：</span>
      <span id="detail-keywords"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">公式効果：</span>
      <span id="detail-effects"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">出典：</span>

      <a
        id="detail-source"
        href=""
        target="_blank"
        rel="noopener noreferrer"
      >
        公式ページを開く
      </a>

    </div>

  </div>


  <script>

    // ========================================
    // GAS API
    // ========================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwvFRsrFEnoZOE2GAEtv6Ihf51tb61B8Uqk_VaolPgkcH0nHC8dqY3436h7Y5L8EoRd/exec";


    // ========================================
    // カードデータ
    // ========================================

    let allCards = [];


    // 現在の表示モード
    let currentDisplayMode = "list";

    // アイコンサイズ
    let currentIconSize = "medium";


    // ========================================
    // 文字列を検索用に変換
    // ========================================

    function normalize(value) {

      return String(value || "")
        .trim()
        .toLowerCase();

    }


    // ========================================
    // 複数登録されている値を分割
    // ========================================

    function splitValues(value) {

      return String(value || "")
        .split(/[,、|｜\n]/)
        .map(value => value.trim())
        .filter(value => value !== "");

    }


    // ========================================
    // 重複を除いた選択肢を作る
    // ========================================

    function getUniqueValues(cards, field) {

      const values = [];

      cards.forEach(card => {

        splitValues(card[field]).forEach(value => {

          if (!values.includes(value)) {
            values.push(value);
          }

        });

      });

      return values.sort((a, b) =>
        a.localeCompare(b, "ja")
      );

    }


    // ========================================
    // 複数選択フィルターを作る
    // ========================================

    function createMultiFilter(elementId, values) {

      const container =
        document.getElementById(elementId);

      container.innerHTML = "";

      values.forEach(value => {

        const label =
          document.createElement("label");

        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.value = value;

        checkbox.addEventListener(
          "change",
          searchCards
        );

        label.appendChild(checkbox);

        label.appendChild(
          document.createTextNode(value)
        );

        container.appendChild(label);

      });

    }


    // ========================================
    // 選択されている値を取得
    // ========================================

    function getSelectedValues(elementId) {

      return [
        ...document.querySelectorAll(
          `#${elementId} input[type="checkbox"]:checked`
        )
      ].map(checkbox => checkbox.value);

    }


    // ========================================
    // カード一覧を表示
    // ========================================

    function displayCards(cards) {

      const cardList =
        document.getElementById("card-list");

      const resultCount =
        document.getElementById("result-count");


      cardList.innerHTML = "";

      resultCount.textContent =
        `検索結果：${cards.length}件`;


      if (cards.length === 0) {

        cardList.innerHTML =
          "<p>該当するカードがありません。</p>";

        return;
      }


      // 現在の表示モードを反映

      if (currentDisplayMode === "list") {

        cardList.className = "list-mode";


        cards.forEach(card => {

          const cardElement =
            document.createElement("div");

          cardElement.className =
            "card list-card";


          cardElement.innerHTML = `

            ${
              card.image_url
                ? `<img
                    src="${card.image_url}"
                    alt="${card.card_name}"
                    class="list-card-image"
                  >`
                : ""
            }

            <div class="list-card-info">

              <h2>${card.card_name}</h2>

              <p>読み：${card.reading}</p>

              <p>
                コスト：${card.cost}
                ／
                タイプ：${card.card_type}
              </p>

              <p>
                種属：${card.species}
              </p>

              <p>
                ATK：${card.atk}
                ／
                DEF：${card.def}
              </p>

              <p>${card.effect_text}</p>

            </div>

          `;


          cardElement.addEventListener(
            "click",
            () => showCardDetail(card)
          );


          cardList.appendChild(cardElement);

        });

      } else {

        // アイコンモード

        cardList.className =
          `icon-mode size-${currentIconSize}`;


        cards.forEach(card => {

          const cardElement =
            document.createElement("div");

          cardElement.className =
            "card icon-card";


          if (card.image_url) {

            cardElement.innerHTML = `
              <img
                src="${card.image_url}"
                alt="${card.card_name}"
                class="icon-card-image"
              >
            `;

          } else {

            cardElement.innerHTML = `
              <div>
                画像なし
              </div>
            `;

          }


          cardElement.addEventListener(
            "click",
            () => showCardDetail(card)
          );


          cardList.appendChild(cardElement);

        });

      }

    }


    // ========================================
    // 表示モード変更
    // ========================================

    function setDisplayMode(mode) {

      currentDisplayMode = mode;


      const listButton =
        document.getElementById(
          "list-mode-button"
        );

      const iconButton =
        document.getElementById(
          "icon-mode-button"
        );

      const sizeControls =
        document.getElementById(
          "icon-size-controls"
        );


      listButton.classList.toggle(
        "active",
        mode === "list"
      );

      iconButton.classList.toggle(
        "active",
        mode === "icon"
      );


      if (mode === "icon") {

        sizeControls.style.display =
          "flex";

      } else {

        sizeControls.style.display =
          "none";

      }


      searchCards();

    }


    // ========================================
    // アイコンサイズ変更
    // ========================================

    function setIconSize(size) {

      currentIconSize = size;


      document
        .getElementById("icon-small-button")
        .classList.toggle(
          "active",
          size === "small"
        );

      document
        .getElementById("icon-medium-button")
        .classList.toggle(
          "active",
          size === "medium"
        );

      document
        .getElementById("icon-large-button")
        .classList.toggle(
          "active",
          size === "large"
        );


      if (currentDisplayMode === "icon") {
        searchCards();
      }

    }


    // ========================================
    // 表示ボタン
    // ========================================

    document
      .getElementById("list-mode-button")
      .addEventListener(
        "click",
        () => setDisplayMode("list")
      );


    document
      .getElementById("icon-mode-button")
      .addEventListener(
        "click",
        () => setDisplayMode("icon")
      );


    document
      .getElementById("icon-small-button")
      .addEventListener(
        "click",
        () => setIconSize("small")
      );


    document
      .getElementById("icon-medium-button")
      .addEventListener(
        "click",
        () => setIconSize("medium")
      );


    document
      .getElementById("icon-large-button")
      .addEventListener(
        "click",
        () => setIconSize("large")
      );


    // ========================================
    // カード詳細
    // ========================================

    function showCardDetail(card) {

      document.getElementById(
        "card-search"
      ).style.display = "none";


      document.getElementById(
        "card-detail"
      ).style.display = "block";


      const image =
        document.getElementById(
          "detail-image"
        );


      if (card.image_url) {

        image.src = card.image_url;

        image.alt = card.card_name;

        image.style.display = "block";

      } else {

        image.style.display = "none";

      }


      document.getElementById(
        "detail-name"
      ).textContent = card.card_name || "";

      document.getElementById(
        "detail-id"
      ).textContent = card.card_id || "";

      document.getElementById(
        "detail-reading"
      ).textContent = card.reading || "";

      document.getElementById(
        "detail-cost"
      ).textContent = card.cost || "";

      document.getElementById(
        "detail-type"
      ).textContent = card.card_type || "";

      document.getElementById(
        "detail-species"
      ).textContent = card.species || "";

      document.getElementById(
        "detail-atk"
      ).textContent = card.atk || "";

      document.getElementById(
        "detail-def"
      ).textContent = card.def || "";

      document.getElementById(
        "detail-effect"
      ).textContent = card.effect_text || "";

      document.getElementById(
        "detail-keywords"
      ).textContent =
        card.official_keywords || "なし";

      document.getElementById(
        "detail-effects"
      ).textContent =
        card.official_effects || "なし";


      const source =
        document.getElementById(
          "detail-source"
        );


      if (card.source_url) {

        source.href =
          card.source_url;

        source.style.display =
          "inline";

      } else {

        source.style.display =
          "none";

      }


      window.scrollTo(0, 0);

    }


    // ========================================
    // 詳細から戻る
    // ========================================

    document
      .getElementById("back-button")
      .addEventListener(
        "click",
        () => {

          document.getElementById(
            "card-detail"
          ).style.display = "none";


          document.getElementById(
            "card-search"
          ).style.display = "block";


          window.scrollTo(0, 0);

        }
      );


    // ========================================
    // 検索
    // ========================================

    function searchCards() {

      const keyword =
        normalize(
          document.getElementById(
            "search-box"
          ).value
        );


      const selectedCardTypes =
        getSelectedValues(
          "card-type-filter"
        );

      const selectedSpecies =
        getSelectedValues(
          "species-filter"
        );

      const selectedCosts =
        getSelectedValues(
          "cost-filter"
        );

      const selectedKeywords =
        getSelectedValues(
          "official-keyword-filter"
        );

      const selectedEffects =
        getSelectedValues(
          "official-effect-filter"
        );


      const atkCondition =
        document.getElementById(
          "atk-condition"
        ).value;

      const atkValue =
        document.getElementById(
          "atk-value"
        ).value;


      const defCondition =
        document.getElementById(
          "def-condition"
        ).value;

      const defValue =
        document.getElementById(
          "def-value"
        ).value;


      const filteredCards =
        allCards.filter(card => {

          // 文字検索

          const cardName =
            normalize(card.card_name);

          const reading =
            normalize(card.reading);

          const effectText =
            normalize(card.effect_text);


          const matchesKeyword =
            keyword === "" ||
            cardName.includes(keyword) ||
            reading.includes(keyword) ||
            effectText.includes(keyword);


          // カードタイプ

          const matchesCardType =
            selectedCardTypes.length === 0 ||
            selectedCardTypes.includes(
              String(card.card_type)
            );


          // 種属

          const matchesSpecies =
            selectedSpecies.length === 0 ||
            selectedSpecies.some(selected =>
              splitValues(card.species)
                .includes(selected)
            );


          // コスト

          const matchesCost =
            selectedCosts.length === 0 ||
            selectedCosts.includes(
              String(card.cost)
            );


          // ATK

          let matchesAtk = true;


          if (
            atkCondition !== "" &&
            atkValue !== ""
          ) {

            const atk =
              Number(card.atk);

            const value =
              Number(atkValue);


            if (atkCondition === "gte") {
              matchesAtk = atk >= value;
            }

            if (atkCondition === "lte") {
              matchesAtk = atk <= value;
            }

          }


          // DEF

          let matchesDef = true;


          if (
            defCondition !== "" &&
            defValue !== ""
          ) {

            const def =
              Number(card.def);

            const value =
              Number(defValue);


            if (defCondition === "gte") {
              matchesDef = def >= value;
            }

            if (defCondition === "lte") {
              matchesDef = def <= value;
            }

          }


          // 公式キーワード

          const matchesOfficialKeyword =
            selectedKeywords.length === 0 ||
            selectedKeywords.some(selected =>
              splitValues(
                card.official_keywords
              ).includes(selected)
            );


          // 公式効果

          const matchesOfficialEffect =
            selectedEffects.length === 0 ||
            selectedEffects.some(selected =>
              splitValues(
                card.official_effects
              ).includes(selected)
            );


          return (
            matchesKeyword &&
            matchesCardType &&
            matchesSpecies &&
            matchesCost &&
            matchesAtk &&
            matchesDef &&
            matchesOfficialKeyword &&
            matchesOfficialEffect
          );

        });


      displayCards(filteredCards);

    }


    // ========================================
    // フィルター作成
    // ========================================

    function createFilterOptions() {

      createMultiFilter(
        "card-type-filter",
        getUniqueValues(
          allCards,
          "card_type"
        )
      );


      createMultiFilter(
        "species-filter",
        getUniqueValues(
          allCards,
          "species"
        )
      );


      const costs =
        getUniqueValues(
          allCards,
          "cost"
        ).sort(
          (a, b) => Number(a) - Number(b)
        );


      createMultiFilter(
        "cost-filter",
        costs
      );


      createMultiFilter(
        "official-keyword-filter",
        getUniqueValues(
          allCards,
          "official_keywords"
        )
      );


      createMultiFilter(
        "official-effect-filter",
        getUniqueValues(
          allCards,
          "official_effects"
        )
      );

    }


    // ========================================
    // 検索欄
    // ========================================

    document
      .getElementById("search-box")
      .addEventListener(
        "input",
        searchCards
      );


    // ========================================
    // ATK / DEF
    // ========================================

    document
      .getElementById("atk-condition")
      .addEventListener(
        "change",
        searchCards
      );


    document
      .getElementById("atk-value")
      .addEventListener(
        "input",
        searchCards
      );


    document
      .getElementById("def-condition")
      .addEventListener(
        "change",
        searchCards
      );


    document
      .getElementById("def-value")
      .addEventListener(
        "input",
        searchCards
      );


    // ========================================
    // リセット
    // ========================================

    document
      .getElementById("reset-button")
      .addEventListener(
        "click",
        () => {

          document.getElementById(
            "search-box"
          ).value = "";


          document
            .querySelectorAll(
              ".multi-select input[type='checkbox']"
            )
            .forEach(checkbox => {
              checkbox.checked = false;
            });


          document.getElementById(
            "atk-condition"
          ).value = "";


          document.getElementById(
            "atk-value"
          ).value = "";


          document.getElementById(
            "def-condition"
          ).value = "";


          document.getElementById(
            "def-value"
          ).value = "";


          displayCards(allCards);

        }
      );


    // ========================================
    // GASからデータ取得
    // ========================================

    function loadCards() {

      window.loadCardData =
        function(data) {

          allCards = data.cards;

          createFilterOptions();

          displayCards(allCards);

        };


      const script =
        document.createElement("script");

      script.src =
        API_URL +
        "?prefix=loadCardData";

      document.body.appendChild(script);

    }


    // ========================================
    // 読み込み開始
    // ========================================

    loadCards();

  </script>

</body>
</html>
