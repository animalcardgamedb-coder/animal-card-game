<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アニマルカードゲーム</title>

  <style>
    /* 検索欄 */
    #search-box {
      width: 100%;
      max-width: 500px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    /* 絞り込み欄 */
    .filter {
      margin-bottom: 10px;
    }

    .filter select {
      padding: 8px;
      font-size: 16px;
      min-width: 180px;
    }

    /* カード画像 */
    .card-image {
      max-width: 300px;
      height: auto;
      display: block;
      margin-bottom: 10px;
    }

    /* カード */
    .card {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <h1>アニマルカードゲーム カード検索</h1>

  <!-- ========================================
       文字検索
       ======================================== -->
  <input
    type="text"
    id="search-box"
    placeholder="カード名・読み・効果テキストを検索"
  >


  <!-- ========================================
       カードタイプ
       ======================================== -->
  <div class="filter">
    <label>
      カードタイプ：
      <select id="card-type-filter">
        <option value="">すべて</option>
      </select>
    </label>
  </div>


  <!-- ========================================
       種属
       ======================================== -->
  <div class="filter">
    <label>
      種属：
      <select id="species-filter">
        <option value="">すべて</option>
      </select>
    </label>
  </div>


  <!-- ========================================
       コスト
       ======================================== -->
  <div class="filter">
    <label>
      コスト：
      <select id="cost-filter">
        <option value="">すべて</option>
      </select>
    </label>
  </div>


  <!-- ========================================
       カード一覧
       ======================================== -->
  <div id="card-list">
    読み込み中……
  </div>


  <script>

    // ========================================
    // GAS APIのURL
    // ========================================
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwvFRsrFEnoZOE2GAEtv6Ihf51tb61B8Uqk_VaolPgkcH0nHC8dqY3436h7Y5L8EoRd/exec";


    // ========================================
    // 取得したカードデータ
    // ========================================
    let allCards = [];


    // ========================================
    // カードを表示する
    // ========================================
    function displayCards(cards) {

      const cardList = document.getElementById("card-list");

      cardList.innerHTML = "";

      // 該当カードがない場合
      if (cards.length === 0) {
        cardList.innerHTML = "<p>該当するカードがありません。</p>";
        return;
      }

      // カードを1枚ずつ表示
      cards.forEach(card => {

        const cardElement = document.createElement("div");

        cardElement.className = "card";

        cardElement.innerHTML = `

          ${
            card.image_url
              ? `<img
                  src="${card.image_url}"
                  alt="${card.card_name}"
                  class="card-image"
                >`
              : ""
          }

          <h2>${card.card_name}</h2>

          <p>カードID：${card.card_id}</p>
          <p>読み：${card.reading}</p>
          <p>コスト：${card.cost}</p>
          <p>タイプ：${card.card_type}</p>
          <p>種属：${card.species}</p>
          <p>ATK：${card.atk}</p>
          <p>DEF：${card.def}</p>
          <p>${card.effect_text}</p>

          <hr>
        `;

        cardList.appendChild(cardElement);
      });
    }


    // ========================================
    // プルダウンの選択肢を作る
    // ========================================
    function createFilterOptions() {

      // ----------------------------
      // カードタイプ
      // ----------------------------
      const cardTypes = [...new Set(
        allCards
          .map(card => card.card_type)
          .filter(value => value !== "")
      )].sort();

      const cardTypeFilter =
        document.getElementById("card-type-filter");

      cardTypes.forEach(type => {

        const option = document.createElement("option");

        option.value = type;
        option.textContent = type;

        cardTypeFilter.appendChild(option);
      });


      // ----------------------------
      // 種属
      // ----------------------------
      const species = [...new Set(
        allCards
          .map(card => card.species)
          .filter(value => value !== "")
      )].sort();

      const speciesFilter =
        document.getElementById("species-filter");

      species.forEach(type => {

        const option = document.createElement("option");

        option.value = type;
        option.textContent = type;

        speciesFilter.appendChild(option);
      });


      // ----------------------------
      // コスト
      // ----------------------------
      const costs = [...new Set(
        allCards
          .map(card => card.cost)
          .filter(value => value !== "")
      )].sort((a, b) => Number(a) - Number(b));

      const costFilter =
        document.getElementById("cost-filter");

      costs.forEach(cost => {

        const option = document.createElement("option");

        option.value = cost;
        option.textContent = cost;

        costFilter.appendChild(option);
      });
    }


    // ========================================
    // 検索・絞り込み
    // ========================================
    function searchCards() {

      // ----------------------------
      // 文字検索
      // ----------------------------
      const keyword = document
        .getElementById("search-box")
        .value
        .trim()
        .toLowerCase();


      // ----------------------------
      // 各条件
      // ----------------------------
      const cardType =
        document.getElementById("card-type-filter").value;

      const species =
        document.getElementById("species-filter").value;

      const cost =
        document.getElementById("cost-filter").value;


      // ----------------------------
      // 条件に合うカードだけ残す
      // ----------------------------
      const filteredCards = allCards.filter(card => {

        const cardName =
          String(card.card_name || "").toLowerCase();

        const reading =
          String(card.reading || "").toLowerCase();

        const effectText =
          String(card.effect_text || "").toLowerCase();


        // 文字検索
        const matchesKeyword =
          keyword === "" ||
          cardName.includes(keyword) ||
          reading.includes(keyword) ||
          effectText.includes(keyword);


        // カードタイプ
        const matchesCardType =
          cardType === "" ||
          String(card.card_type) === cardType;


        // 種属
        const matchesSpecies =
          species === "" ||
          String(card.species) === species;


        // コスト
        const matchesCost =
          cost === "" ||
          String(card.cost) === cost;


        // すべての条件を満たしたカードだけ表示
        return (
          matchesKeyword &&
          matchesCardType &&
          matchesSpecies &&
          matchesCost
        );
      });


      displayCards(filteredCards);
    }


    // ========================================
    // GASからカードデータを取得
    // ========================================
    function loadCards() {

      window.loadCardData = function(data) {

        // カードデータを保存
        allCards = data.cards;

        // プルダウンを作成
        createFilterOptions();

        // 最初は全部表示
        displayCards(allCards);
      };


      // JSONP用scriptタグ
      const script = document.createElement("script");

      script.src = API_URL + "?prefix=loadCardData";

      document.body.appendChild(script);
    }


    // ========================================
    // 入力・選択されたら検索
    // ========================================
    document
      .getElementById("search-box")
      .addEventListener("input", searchCards);

    document
      .getElementById("card-type-filter")
      .addEventListener("change", searchCards);

    document
      .getElementById("species-filter")
      .addEventListener("change", searchCards);

    document
      .getElementById("cost-filter")
      .addEventListener("change", searchCards);


    // ========================================
    // カード読み込み開始
    // ========================================
    loadCards();

  </script>

</body>
</html>
