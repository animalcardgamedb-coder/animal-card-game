<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    アニマルカードゲーム カード検索
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <!--
    検索を開くボタン
  -->

  <button
    id="search-open-button"
    aria-label="検索を開く"
    title="検索"
  >
    🔍
  </button>


  <div id="card-search">

    <h1>
      アニマルカードゲーム カード検索
    </h1>


    <!--
      カテゴリ切り替え
    -->

    <div id="category-controls">

      <div class="display-control-group">

        <span>
          種類：
        </span>

        <button
          id="category-all-button"
          class="display-button active"
        >
          すべて
        </button>

        <button
          id="category-card-button"
          class="display-button"
        >
          カード
        </button>

        <button
          id="category-territory-button"
          class="display-button"
        >
          領地
        </button>

      </div>

    </div>


    <!--
      表示方法・アイコン列数
    -->

    <div id="display-controls">

      <div class="display-control-group">

        <span>
          表示：
        </span>

        <button
          id="list-mode-button"
          class="display-button active"
        >
          リスト
        </button>

        <button
          id="icon-mode-button"
          class="display-button"
        >
          アイコン
        </button>

      </div>


      <div
        id="icon-size-controls"
        class="display-control-group"
        style="display: none;"
      >

        <span>
          列数：
        </span>

        <button
          id="icon-3-button"
          class="display-button"
        >
          3列
        </button>

        <button
          id="icon-5-button"
          class="display-button active"
        >
          5列
        </button>

        <button
          id="icon-7-button"
          class="display-button"
        >
          7列
        </button>

        <button
          id="icon-9-button"
          class="display-button"
        >
          9列
        </button>

        <button
          id="icon-10-button"
          class="display-button"
        >
          10列
        </button>

      </div>

    </div>


    <div id="result-count"></div>


    <div
      id="card-list"
      class="list-mode"
    >
      読み込み中……
    </div>

  </div>


  <!--
    検索モーダル
  -->

  <div id="search-modal">

    <div id="search-modal-content">

      <button
        id="search-close-button"
        aria-label="検索を閉じる"
      >
        ×
      </button>


      <h2 id="search-modal-title">
        カード・領地検索
      </h2>


      <!--
        文字検索
      -->

      <div class="filter">

        <div class="filter-title">
          検索
        </div>

        <input
          type="text"
          id="search-box"
          placeholder="例：火 竜 -ドラゴン"
        >

        <p id="search-help">
          スペース：AND検索　　-：マイナス検索
        </p>

      </div>


      <!--
        カードタイプ

        カードの「カードタイプ」と
        領地の「領地タイプ」を
        ここにまとめて表示します。
      -->

      <div class="filter">

        <div class="filter-title">
          カードタイプ
        </div>

        <div
          id="card-type-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        種属
      -->

      <div class="filter">

        <div class="filter-title">
          種属
        </div>

        <div
          id="species-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        コスト
      -->

      <div class="filter">

        <div class="filter-title">
          コスト
        </div>

        <div
          id="cost-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        ATK
      -->

      <div class="filter">

        <div class="filter-title">
          ATK
        </div>

        <div class="number-filter">

          <select id="atk-condition">

            <option value="">
              指定なし
            </option>

            <option value="gte">
              以上
            </option>

            <option value="lte">
              以下
            </option>

          </select>


          <input
            type="number"
            id="atk-value"
            placeholder="ATK"
          >

        </div>

      </div>


      <!--
        DEF
      -->

      <div class="filter">

        <div class="filter-title">
          DEF
        </div>

        <div class="number-filter">

          <select id="def-condition">

            <option value="">
              指定なし
            </option>

            <option value="gte">
              以上
            </option>

            <option value="lte">
              以下
            </option>

          </select>


          <input
            type="number"
            id="def-value"
            placeholder="DEF"
          >

        </div>

      </div>


      <!--
        カード：キーワード能力
      -->

      <div class="filter">

        <div class="filter-title">
          カード：キーワード能力
        </div>

        <div
          id="card-keyword-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        領地：キーワード能力
      -->

      <div class="filter">

        <div class="filter-title">
          領地：キーワード能力
        </div>

        <div
          id="territory-keyword-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        カード：効果分類
      -->

      <div class="filter">

        <div class="filter-title">
          カード：効果分類
        </div>

        <div
          id="card-effect-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        領地：効果分類
      -->

      <div class="filter">

        <div class="filter-title">
          領地：効果分類
        </div>

        <div
          id="territory-effect-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        検索条件リセット
      -->

      <button
        id="reset-button"
        type="button"
      >
        検索条件をリセット
      </button>

    </div>

  </div>


  <!--
    カード・領地詳細モーダル
  -->

  <div id="card-modal">

    <div id="card-modal-content">

      <button
        id="modal-close-button"
        aria-label="詳細を閉じる"
      >
        ×
      </button>


      <img
        id="detail-image"
        src=""
        alt=""
      >


      <h2 id="detail-name"></h2>


      <div class="detail-row">

        <span class="detail-label">
          カードID：
        </span>

        <span id="detail-id"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          読み：
        </span>

        <span id="detail-reading"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          コスト：
        </span>

        <span id="detail-cost"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          カードタイプ：
        </span>

        <span id="detail-type"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          種属：
        </span>

        <span id="detail-species"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          ATK：
        </span>

        <span id="detail-atk"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          DEF：
        </span>

        <span id="detail-def"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          効果：
        </span>

        <div id="detail-effect"></div>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          キーワード能力：
        </span>

        <span id="detail-keywords"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          効果分類：
        </span>

        <span id="detail-effects"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          出典：
        </span>

        <a
          id="detail-source"
          href=""
          target="_blank"
          rel="noopener noreferrer"
        >
          公式ページを開く
        </a>

      </div>

    </div>

  </div>


  <!--
    JavaScript
  -->

  <script src="js/api.js"></script>

  <script src="js/search.js"></script>

  <script src="js/display.js"></script>

  <script src="js/main.js"></script>

</body>

</html>
