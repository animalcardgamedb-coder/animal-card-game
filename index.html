<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アニマルカードゲーム</title>

  <style>
    /* カード画像の大きさ */
    .card-image {
      max-width: 300px;
      height: auto;
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <h1>アニマルカードゲーム</h1>

  <div id="card-list">
    読み込み中……
  </div>

  <script>

    // ========================================
    // GAS APIのURL
    // ========================================
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwvFRsrFEnoZOE2GAEtv6Ihf51tb61B8Uqk_VaolPgkcH0nHC8dqY3436h7Y5L8EoRd/exec";


    // ========================================
    // GASからカードデータを取得する
    // JSONPを使用するため、fetch()は使わない
    // ========================================
    function loadCards() {

      // JSONPから呼び出される関数を作成
      window.loadCardData = function(data) {

        // 取得したカードデータ
        const cards = data.cards;

        // カード一覧を表示する場所
        const cardList = document.getElementById("card-list");

        // 「読み込み中……」を消す
        cardList.innerHTML = "";

        // カードを1枚ずつ表示
        cards.forEach(card => {

          const cardElement = document.createElement("div");

          cardElement.innerHTML = `

            ${
              card.image_url
                ? `<img
                    src="${card.image_url}"
                    alt="${card.card_name}"
                    class="card-image"
                  >`
                : ""
            }

            <h2>${card.card_name}</h2>
            <p>カードID：${card.card_id}</p>
            <p>読み：${card.reading}</p>
            <p>コスト：${card.cost}</p>
            <p>タイプ：${card.card_type}</p>
            <p>種属：${card.species}</p>
            <p>ATK：${card.atk}</p>
            <p>DEF：${card.def}</p>
            <p>${card.effect_text}</p>
            <hr>
          `;

          cardList.appendChild(cardElement);
        });
      };


      // ========================================
      // JSONP用のscriptタグを作成
      // ========================================
      const script = document.createElement("script");

      script.src = API_URL + "?prefix=loadCardData";

      // HTMLにscriptタグを追加すると
      // GASからデータが読み込まれる
      document.body.appendChild(script);
    }


    // ========================================
    // カード読み込み開始
    // ========================================
    loadCards();

  </script>

</body>
</html>
