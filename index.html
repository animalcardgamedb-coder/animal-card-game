<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    アニマルカードゲーム カード検索
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    /*
      ======================================
      一括登録モーダル
      ======================================
    */

    #bulk-import-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      overflow-y: auto;
      padding: 30px 15px;
      box-sizing: border-box;
    }

    #bulk-import-modal-content {
      position: relative;
      width: min(700px, 100%);
      margin: 0 auto;
      padding: 25px;
      box-sizing: border-box;
      background: #ffffff;
      border-radius: 8px;
      color: #222222;
    }

    #bulk-import-close-button {
      position: absolute;
      top: 8px;
      right: 12px;
      border: none;
      background: transparent;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
    }

    #bulk-import-modal-content h2 {
      margin-top: 0;
      padding-right: 35px;
    }

    #bulk-import-file {
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
    }

    #bulk-import-button {
      margin-top: 10px;
    }

    #bulk-import-status {
      margin-top: 15px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    #bulk-import-result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      background: #f5f5f5;
      white-space: pre-wrap;
      line-height: 1.7;
      overflow-wrap: break-word;
    }

    #bulk-import-errors {
      margin-top: 10px;
    }

    #bulk-import-errors ul {
      margin: 5px 0 0;
      padding-left: 20px;
    }

    #bulk-import-warnings {
      margin-top: 10px;
    }

    #bulk-import-warnings ul {
      margin: 5px 0 0;
      padding-left: 20px;
    }

    .bulk-import-error {
      color: #b00020;
    }

    .bulk-import-warning {
      color: #8a5a00;
    }

  </style>

</head>


<body>

  <!--
    検索を開くボタン
  -->

  <button
    id="search-open-button"
    aria-label="検索を開く"
    title="検索"
  >
    🔍
  </button>


  <div id="card-search">

    <h1>
      アニマルカードゲーム カード検索
    </h1>


    <!--
      カテゴリ切り替え
    -->

    <div id="category-controls">

      <div class="display-control-group">

        <span>
          種類：
        </span>

        <button
          id="category-all-button"
          class="display-button active"
        >
          すべて
        </button>

        <button
          id="category-card-button"
          class="display-button"
        >
          カード
        </button>

        <button
          id="category-territory-button"
          class="display-button"
        >
          領地
        </button>

        <button
          id="bulk-import-open-button"
          class="display-button"
          type="button"
        >
          データ登録
        </button>

      </div>

    </div>


    <!--
      表示方法・アイコン列数
    -->

    <div id="display-controls">

      <div class="display-control-group">

        <span>
          表示：
        </span>

        <button
          id="list-mode-button"
          class="display-button active"
        >
          リスト
        </button>

        <button
          id="icon-mode-button"
          class="display-button"
        >
          アイコン
        </button>

      </div>


      <div
        id="icon-size-controls"
        class="display-control-group"
        style="display: none;"
      >

        <span>
          列数：
        </span>

        <button
          id="icon-3-button"
          class="display-button"
        >
          3列
        </button>

        <button
          id="icon-5-button"
          class="display-button active"
        >
          5列
        </button>

        <button
          id="icon-7-button"
          class="display-button"
        >
          7列
        </button>

        <button
          id="icon-9-button"
          class="display-button"
        >
          9列
        </button>

        <button
          id="icon-10-button"
          class="display-button"
        >
          10列
        </button>

      </div>

    </div>


    <div id="result-count"></div>


    <div
      id="card-list"
      class="list-mode"
    >
      読み込み中……
    </div>

  </div>


  <!--
    検索モーダル
  -->

  <div id="search-modal">

    <div id="search-modal-content">

      <button
        id="search-close-button"
        aria-label="検索を閉じる"
      >
        ×
      </button>


      <h2 id="search-modal-title">
        カード・領地検索
      </h2>


      <!--
        文字検索
      -->

      <div class="filter">

        <div class="filter-title">
          検索
        </div>

        <input
          type="text"
          id="search-box"
          placeholder="例：火 竜 -ドラゴン"
        >

        <p id="search-help">
          スペース：AND検索　　-：マイナス検索
        </p>

      </div>


      <!--
        カードタイプ
      -->

      <div class="filter">

        <div class="filter-title">
          カードタイプ
        </div>

        <div
          id="card-type-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        種属
      -->

      <div class="filter">

        <div class="filter-title">
          種属
        </div>

        <div
          id="species-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        コスト
      -->

      <div class="filter">

        <div class="filter-title">
          コスト
        </div>

        <div
          id="cost-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        ATK
      -->

      <div class="filter">

        <div class="filter-title">
          ATK
        </div>

        <div class="number-filter">

          <select id="atk-condition">

            <option value="">
              指定なし
            </option>

            <option value="gte">
              以上
            </option>

            <option value="lte">
              以下
            </option>

          </select>


          <input
            type="number"
            id="atk-value"
            placeholder="ATK"
          >

        </div>

      </div>


      <!--
        DEF
      -->

      <div class="filter">

        <div class="filter-title">
          DEF
        </div>

        <div class="number-filter">

          <select id="def-condition">

            <option value="">
              指定なし
            </option>

            <option value="gte">
              以上
            </option>

            <option value="lte">
              以下
            </option>

          </select>


          <input
            type="number"
            id="def-value"
            placeholder="DEF"
          >

        </div>

      </div>


      <!--
        カード：キーワード能力
      -->

      <div class="filter">

        <div class="filter-title">
          カード：キーワード能力
        </div>

        <div
          id="card-keyword-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        領地：キーワード能力
      -->

      <div class="filter">

        <div class="filter-title">
          領地：キーワード能力
        </div>

        <div
          id="territory-keyword-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        カード：効果分類
      -->

      <div class="filter">

        <div class="filter-title">
          カード：効果分類
        </div>

        <div
          id="card-effect-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        領地：効果分類
      -->

      <div class="filter">

        <div class="filter-title">
          領地：効果分類
        </div>

        <div
          id="territory-effect-filter"
          class="multi-select"
        >
        </div>

      </div>


      <!--
        検索条件リセット
      -->

      <button
        id="reset-button"
        type="button"
      >
        検索条件をリセット
      </button>

    </div>

  </div>


  <!--
    一括データ登録モーダル
  -->

  <div id="bulk-import-modal">

    <div id="bulk-import-modal-content">

      <button
        id="bulk-import-close-button"
        aria-label="データ登録を閉じる"
        type="button"
      >
        ×
      </button>


      <h2>
        データ一括登録
      </h2>


      <p>
        公式サイトから保存したHTMLファイルを選択してください。
      </p>


      <p>
        ACGカード・RYO領地を自動判別して登録します。
      </p>


      <input
        type="file"
        id="bulk-import-file"
        accept=".html,.htm,.txt"
      >


      <button
        id="bulk-import-button"
        class="display-button"
        type="button"
      >
        一括登録
      </button>


      <div id="bulk-import-status"></div>


      <div id="bulk-import-result">

        <div id="bulk-import-summary"></div>

        <div
          id="bulk-import-errors"
          class="bulk-import-error"
        ></div>

        <div
          id="bulk-import-warnings"
          class="bulk-import-warning"
        ></div>

      </div>

    </div>

  </div>


  <!--
    カード・領地詳細モーダル
  -->

  <div id="card-modal">

    <div id="card-modal-content">

      <button
        id="modal-close-button"
        aria-label="詳細を閉じる"
      >
        ×
      </button>


      <img
        id="detail-image"
        src=""
        alt=""
      >


      <h2 id="detail-name"></h2>


      <div class="detail-row">

        <span class="detail-label">
          カードID：
        </span>

        <span id="detail-id"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          読み：
        </span>

        <span id="detail-reading"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          コスト：
        </span>

        <span id="detail-cost"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          カードタイプ：
        </span>

        <span id="detail-type"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          種属：
        </span>

        <span id="detail-species"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          ATK：
        </span>

        <span id="detail-atk"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          DEF：
        </span>

        <span id="detail-def"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          効果：
        </span>

        <div id="detail-effect"></div>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          キーワード能力：
        </span>

        <span id="detail-keywords"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          効果分類：
        </span>

        <span id="detail-effects"></span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          出典：
        </span>

        <a
          id="detail-source"
          href=""
          target="_blank"
          rel="noopener noreferrer"
        >
          公式ページを開く
        </a>

      </div>

    </div>

  </div>


  <!--
    JavaScript
  -->

  <script src="js/api.js"></script>

  <script src="js/search.js"></script>

  <script src="js/display.js"></script>

  <script src="js/main.js"></script>

</body>

</html>
